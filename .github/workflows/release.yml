name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extension
        run: |
          mkdir -p dist
          zip -r "dist/ContextExporter-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" ".github/*" "dist/*" "assets/*" "*.zip" "*.md" ".gitignore"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
